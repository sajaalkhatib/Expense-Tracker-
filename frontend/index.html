<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <!--bootstrap Icon-->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!--Navbar-->
  <nav class="navbar navbar-dark bg-primary">
      <a class="navbar-brand fw-bold" id="navbar">Expense Tracker</a>
  </nav>
  
  <!---Bootstrap Alert and spinner-->
  <div id="alertContainer" class="container mt-3"></div>

<div id="loadingSpinner" class="text-center my-4 d-none">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<div class="container mt-4">

    <div class="row">

        <div class="col-md-4">
            <div class="card p-3">
                <p>Total Amount</p>
                <h3 id="totalAmount">$0</h3>
            </div>
        </div>


        <div class="col-md-4">
            <div class="card p-3">
                <p>Number of Expenses</p>
                <h3 id="expensesCount">0</h3>
            </div>
          </div>

        <div class="col-md-4">
            <div class="card p-3">
                <p>Highest Expense</p>
                <h3 id="highestExpense">$0</h3>
            </div>
        </div>

    </div>

</div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  
</body>
</html>
