<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">
        <i class="bi bi-wallet2 me-2"></i>Expense Tracker
      </span>
    </div>
  </nav>

  <div class="container">

    <div id="alertContainer"></div>

    <div id="loadingSpinner" class="text-center my-3 d-none">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div class="summary-grid">

      <div class="summary-card">
        <p>Total Amount</p>
        <h3 id="totalAmount" class="total-amount">$0.00</h3>
      </div>

      <div class="summary-card">
        <p>Number of Expenses</p>
        <h3 id="expensesCount">0</h3>
      </div>

      <div class="summary-card">
        <p>Highest Expense</p>
        <h3 id="highestExpense" class="highest-expense">$0.00</h3>
      </div>

    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0"><i class="bi bi-plus-circle me-1"></i> Add Expense</h5>
      </div>
      <div class="card-body">
        <form id="expenseForm">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Title</label>
              <input type="text" id="title" class="form-control" placeholder="Expense title" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Category</label>
              <select id="category" class="form-select" required>
                <option value="" selected disabled>Choose category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Amount ($)</label>
              <input type="number" id="amount" class="form-control" placeholder="0.00" min="0.01" step="0.01" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Date</label>
              <input type="date" id="date" class="form-control" required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> Add Expense
          </button>
        </form>
      </div>
    </div>

    <div class="card shadow-sm mb-5">
      <div class="card-header py-3">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
          <h5 class="mb-0"><i class="bi bi-list-ul me-1"></i> Expenses List</h5>
          <div class="d-flex gap-2">
            <button id="clearFiltersBtn" class="btn btn-sm btn-outline-secondary">Clear Filters</button>
            <button id="downloadCsvBtn" class="btn btn-sm btn-outline-success">
              <i class="bi bi-download me-1"></i> Download CSV
            </button>
          </div>
        </div>


        <div class="row g-2">
          <div class="col-12 col-md-4">
            <div class="input-group input-group-sm">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input type="text" id="searchTitle" class="form-control" placeholder="Search by title...">
            </div>
          </div>
          
          <div class="col-12 col-md-4">
            <div class="input-group input-group-sm">
              <span class="input-group-text"><i class="bi bi-tag"></i></span>
              <select id="filterCategory" class="form-select">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div class="col-12 col-md-4">
            <div class="input-group input-group-sm">
              <span class="input-group-text"><i class="bi bi-calendar3"></i></span>
              <input type="month" id="filterMonth" class="form-control" title="Filter by month">
            </div>
          </div>
        </div>
      </div>

      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-striped table-hover mb-0 align-middle">
            <thead class="table-light">
              <tr>
                <th class="ps-3">Title</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th class="text-end pe-3">Actions</th>
              </tr>
            </thead>
            <tbody id="expensesTableBody">
            </tbody>
          </table>
        </div>

        <div id="noExpensesMessage" class="text-center p-4 text-muted d-none">
          <i class="bi bi-inbox fs-2 d-block mb-1"></i>
          No expenses found.
        </div>
      </div>
    </div>

  </div>

  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="editForm">
            <input type="hidden" id="editId">
            <div class="mb-3">
              <label class="form-label">Title</label>
              <input type="text" id="editTitle" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Category</label>
              <select id="editCategory" class="form-select" required>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            
            <div class="mb-3">
              <label class="form-label">Amount ($)</label>
              <input type="number" id="editAmount" class="form-control" min="0.01" step="0.01" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Date</label>
              <input type="date" id="editDate" class="form-control" required>
            </div>
            <div class="text-end">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>


  
</body>
</html>
